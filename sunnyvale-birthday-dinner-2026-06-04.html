<script>
function reportApp(){
  return {
    data: {},
    filter: '',
    onlyDiffs: false,
    init(){ this.data = JSON.parse(document.getElementById('data').textContent); },
    visibleRows(){
      const f = this.filter.trim().toLowerCase();
      return (this.data.rows||[]).filter(r=>{
        if (this.onlyDiffs) {
          const texts = (r.items||[]).map(i=>JSON.stringify(i.value));
          if (new Set(texts).size <= 1) return false;
        }
        if (!f) return true;
        const hay = JSON.stringify(r).toLowerCase();
        return hay.includes(f);
      });
    }
  };
}
</script>
