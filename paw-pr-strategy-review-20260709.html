<script>
function board(){
  return {
    data: {},
    deltaColor(k){
      const d = (k.delta||'').trim();
      if (!d) return 'text-zinc-400';
      const sign = d.startsWith('-') ? 'neg' : d.startsWith('+') ? 'pos' : 'flat';
      // delta_good = "up" means + is good (green); "down" means - is good (green).
      // Default: assume higher is better (most metrics).
      const good = k.delta_good || 'up';
      if (sign === 'flat') return 'text-zinc-400';
      const isGood = (good === 'up' && sign === 'pos') || (good === 'down' && sign === 'neg');
      return isGood ? 'text-emerald-700' : 'text-rose-700';
    },
    init(){
      this.data = JSON.parse(document.getElementById('data').textContent);
      const traces = (this.data.curves||[]).map(c => ({
        x: c.x, y: c.y, name: c.name, mode: 'lines', type: 'scatter',
      }));
      Plotly.newPlot('curves', traces, {
        margin: {t: 10, r: 10, b: 40, l: 50},
        legend: {orientation: 'h'},
        xaxis: {title: 'step'}, yaxis: {title: 'value'},
        paper_bgcolor: 'white', plot_bgcolor: 'white',
      }, {displayModeBar: false, responsive: true});
    }
  };
}
